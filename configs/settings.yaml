# =============================================================
# CellLineSelector — Central Configuration
# =============================================================
# All paths are relative to the project root.
# Never hardcode these values in scripts — always import from here.
# =============================================================

# Project Metadata
project:
  name: CellLineSelector
  version: "0.1.0"
  description: "Recommendation system for cell line selection using multi-omics data"

# Data Paths
paths:
  # Raw input files
  raw:
    gene_expression:
      depmap: "data/raw/gene expression/2_DepMap_OmicsExpressionAllGenesTPMLogp1Profile.csv"
      hpa_rna: "data/raw/gene expression/1_4_hpa_rna_celline.tsv"
      geo: "data/raw/gene expression/3_GEOexpression.txt"
      proteomics: "data/raw/gene expression/4_Harmonized_MS_CCLE_Gygi_subsetted.csv"

    non_gene_expression:
      metabolomics: "data/raw/non gene expression/12_CCLE_metabolomics_20190502.csv"
      mirna: "data/raw/non gene expression/13_CCLE_miRNA_20181103.gct"
      signatures: "data/raw/non gene expression/14_OmicsGlobalSignatures.csv"

    nomenclature:
      cellosaurus: "data/raw/nomenclature/7_cellosaurus.csv"
      geo_info: "data/raw/nomenclature/10_GEOInfo.txt"
      depmap_sample: "data/raw/nomenclature/9_DepMap_sample_info.csv"
      depmap_omics: "data/raw/nomenclature/8_DepMap_OmicsProfiles.csv"
      hpa_desc: "data/raw/nomenclature/11_hpa_rna_celline_description.tsv"

    gene_properties:
      fusions: "data/raw/gene properties/5_OmicsFusionFilteredSupplementary.csv"
      mutations: "data/raw/gene properties/6_OmicsSomaticMutationsProfile.csv"

  # Processed outputs (generated by pipeline — git-ignored)
  processed:
    base: "data/processed/"
    master_index: "data/processed/master_cell_line_index.parquet"
    alias_lookup: "data/processed/alias_lookup_table.parquet"
    depmap_expression: "data/processed/depmap_expression.parquet"
    hpa_expression: "data/processed/hpa_expression.parquet"
    geo_expression: "data/processed/geo_expression.parquet"
    proteomics: "data/processed/proteomics.parquet"
    mutations: "data/processed/mutations.parquet"
    fusions: "data/processed/fusions.parquet"
    metabolomics: "data/processed/metabolomics.parquet"
    mirna: "data/processed/mirna.parquet"
    signatures: "data/processed/signatures.parquet"
    feature_store: "data/processed/unified_feature_store.parquet"

  # Outputs (reports, exports — git-ignored)
  outputs:
    base: "outputs/"
    reports: "outputs/reports/"
    exports: "outputs/exports/"
    logs: "outputs/logs/"

# Entity Resolution
entity_resolution:
  # Cellosaurus filters
  human_taxid: "9606"
  target_categories:
    - "Cancer cell line"
    - "Transformed cell line"        # include transformed human lines too

  # Fuzzy matching settings
  fuzzy_match_threshold: 85          # minimum score (0-100) to accept a match
  fuzzy_match_method: "token_sort_ratio"   # rapidfuzz method

  # Columns used for name normalisation before matching
  strip_chars: "[ \\-_./]"          # regex — remove these chars for stripped matching

# Expression Thresholds
thresholds:
  # A gene is considered "expressed" if its value exceeds this percentile
  # across all cell lines in that dataset
  expression_percentile: 75         # 75th percentile = top quarter of expressors

  # Minimum expression value (absolute) — filters out near-zero noise
  min_expression_depmap: 1.0        # log2(TPM+1) units
  min_expression_hpa: 1.0           # nTPM units
  min_expression_geo: 1.0           # study-dependent units

  # Protein abundance threshold (proteomics)
  min_protein_abundance: 0.0        # z-score — above 0 means above average

# Confidence Scoring
confidence:
  # Weights for each dataset when computing cross-dataset confidence score
  # Must sum to 1.0
  dataset_weights:
    depmap: 0.40               # largest, most curated — highest weight
    hpa: 0.25               # well-maintained, good coverage
    proteomics: 0.20               # protein-level evidence — valuable
    geo: 0.15               # smaller, study-specific — lower weight

  # Minimum number of datasets a cell line must appear in
  # to receive a high confidence score
  min_datasets_high_confidence: 3
  min_datasets_medium_confidence: 2

  # Penalty applied when model_manipulation is detected
  manipulation_penalty: 0.20        # reduce score by 20%

  # Penalty when a damaging mutation is found in target gene
  mutation_penalty: 0.15

# Similarity
similarity:
  method: "cosine"                  # cosine | pearson | euclidean
  top_n_similar: 10                 # return top 10 similar cell lines
  features_used: # which feature columns to use for similarity
    - "depmap_expression"
    - "hpa_expression"
    - "proteomics"

# Logging
logging:
  level: "INFO"                     # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  log_file: "outputs/logs/cellline_selector.log"
  rotation: "10 MB"                 # rotate log file at 10MB
  retention: "7 days"

# API
api:
  host: "0.0.0.0"
  port: 8000
  reload: true                      # auto-reload on code change (dev only)
  max_results: 50                   # max cell lines returned per query

# Streamlit UI
ui:
  title: "CellLineSelector"
  subtitle: "Evidence-based cell line recommendations for AstraZeneca"
  max_display_results: 20           # show top 20 in UI table
  default_top_n: 10                 # default ranking list length

# Pipeline
pipeline:
  # Set to false in order to skip a stage if already processed
  run_ingestion: true
  run_harmonisation: true
  run_scoring: true
  force_reprocess: false            # if true, reprocess even if output exists
